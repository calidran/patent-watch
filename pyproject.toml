[project]
name = "patent-watch"
version = "0.1.1"
description = "Watch a company's US patent applications: office actions, allowances, abandonments, grants, assignments, PTAB petitions — to Slack, email, or a webhook."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patent Data", email = "rish@patentdata.ai" }]
keywords = ["patents", "uspto", "patent-status", "office-action", "mcp", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "click>=8.1"]

[project.urls]
Homepage = "https://patentdata.ai"
Source = "https://github.com/rishavmukherji/patent-watch"
"API docs" = "https://api.patentdata.ai/docs"

[project.scripts]
patent-watch = "patent_watch:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patent_watch.py"]
